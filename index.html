<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G3 Lesson 7 | Vocabulary Lab</title><style>
:root{--ink:#25334e;--muted:#6e7a92;--violet:#7b6cd9;--line:#e6e9f2;--pink:#ffe1ed;--mint:#def7ee;--blue:#e4eeff;--bg:#f7f8ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#fff5f9,#f5f8ff 52%,#f1fff9);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}header{background:#ffffffd9;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}.head{max-width:1000px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-weight:900;font-size:18px}.teacher{background:#fff1da;color:#765022;border:1px solid #f6d8a4;border-radius:14px;padding:11px 15px;font-weight:850}.wrap{max-width:850px;margin:25px auto;padding:0 16px 45px}.panel{background:white;border:1px solid #e9eaf4;box-shadow:0 14px 38px #63759a14;border-radius:26px;padding:clamp(18px,4vw,36px)}.hero{text-align:center;margin-bottom:18px}.hero h1{font-size:clamp(24px,4vw,36px);margin:4px 0}.sub{color:var(--muted);font-size:14px;line-height:1.65}.pill{display:inline-block;background:#edeaff;color:#6254ba;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:800}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;font-weight:750}.field input{color:#25334e!important;-webkit-text-fill-color:#25334e!important;caret-color:#25334e!important;color-scheme:light;width:100%;padding:14px;border-radius:14px;border:1px solid #d9deea;background:#fcfcff}.field input,.field input:focus{color:#25334e!important;-webkit-text-fill-color:#25334e!important;caret-color:#25334e!important}.field input::placeholder{color:#8791a5!important;opacity:1}.field input:-webkit-autofill{-webkit-text-fill-color:#25334e!important;box-shadow:0 0 0 1000px #fcfcff inset!important}.field input::placeholder{color:#8792a8!important;-webkit-text-fill-color:#8792a8!important;opacity:1}.field input:focus{outline:2px solid #8c7bdf;outline-offset:1px}.avatars{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px}.avatar{font-size:29px;border:2px solid transparent;border-radius:14px;background:#f4f6ff;padding:8px 12px}.avatar.sel{border-color:#8c7bdf;background:#eae7ff}.btn{border:0;background:#7868d8;color:white;padding:14px 20px;border-radius:15px;font-weight:850;box-shadow:0 5px 12px #7767d824}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#edf0fb;color:#45516e;box-shadow:none}.btn.outline{background:white;border:1px solid #d9ddec;color:#59627e;box-shadow:none}.btn.good{background:#22a879}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions .btn{flex:1}.progress{height:10px;border-radius:20px;background:#eef0f9;overflow:hidden;margin:12px 0 24px}.progress>div{height:100%;background:linear-gradient(90deg,#a69af0,#65d2b0);transition:width .25s}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.word{font-size:clamp(31px,6vw,54px);font-weight:900;margin:12px 0;color:#4e50a0;overflow-wrap:anywhere}.meaning{font-size:24px;color:#c44872;font-weight:800}.google-link{display:inline-flex;align-items:center;justify-content:center;background:#e7f1ff;color:#24589a;border:2px solid #bad5ff;border-radius:15px;padding:13px 18px;font-weight:850;text-decoration:none;margin:12px 0}.google-link:hover{background:#d8e9ff}.example{background:#f6f7ff;padding:18px;border-radius:17px;line-height:1.75;margin-top:12px}.example strong{font-size:17px}.translation{color:#546178;margin-top:8px}.small{font-size:13px;color:var(--muted)}.sound{background:#e9f6ff;border:0;color:#256eaa;border-radius:10px;padding:7px 10px;margin-left:8px;font-weight:700}.choices{display:grid;gap:12px;margin-top:20px}.choice{width:100%;text-align:left;border:2px solid #e6e8f3;border-radius:17px;padding:17px 20px;background:#fafbff;color:#283550;font-weight:750;line-height:1.55}.choice:hover{border-color:#b9b1ec}.choice.correct{border-color:#26b486;background:#e6fff4}.choice.wrong{border-color:#ee7a8d;background:#fff0f1}.flash{padding:30px 12px;text-align:center;background:#fff3f6;border:2px solid #ffcbd7;border-radius:22px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.flash .big{font-size:clamp(27px,5vw,42px);color:#d33957;font-weight:900}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f4f6ff;border-radius:16px;padding:14px;text-align:center}.stat b{font-size:23px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{padding:12px;border-bottom:1px solid #edf0f5;text-align:left}th{background:#f5f6ff}tr.rank1{background:#ffe4ef}tr.rank2{background:#fff0de}tr.rank3{background:#fff9d9}tr.rank4{background:#e6f8e9}tr.rank5{background:#e5edff}.notice{background:#fff8e9;border:1px solid #f3d9a7;padding:14px;border-radius:14px;line-height:1.6;margin-top:14px}.danger{background:#fff0f1;color:#b53b54;border:1px solid #ffd1d7}.hidden{display:none!important}.tag{font-size:12px;color:#6d6798;font-weight:800}.center{text-align:center}@media(max-width:580px){.fields{grid-template-columns:1fr}.panel{padding:19px}.teacher{font-size:13px;padding:10px}.head .logo{font-size:15px}.statgrid{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="head"><div class="logo">🌈 G3 L7 · Vocabulary Lab</div><button class="teacher" id="teacherBtn">👨‍🏫 교사 대시보드</button></div></header><main class="wrap" id="app"></main><script>const WORDS=[{"id":1,"word":"rent","meaning":"빌리다","example":"We decided to rent bicycles instead of taking a taxi to explore the old town.","translation":"우리는 구시가지를 둘러보기 위해 택시를 타는 대신 자전거를 빌리기로 했다.","wrongTranslation":"우리는 구시가지를 둘러보기 위해 택시를 타는 대신 자전거를 구입하기로 했다.","pos":"v.","derived":"rental (n.)","wrongWords":["rend","rest"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"우리는 구시가지를 둘러보기 위해 택시를 탄 다음 자전거를 빌리기로 했다."},{"id":2,"word":"develop","meaning":"개발하다, 발전시키다","example":"The researchers developed a new device that can detect dangerous gases.","translation":"연구원들은 위험한 가스를 감지할 수 있는 새로운 장치를 개발했다.","wrongTranslation":"연구원들은 위험한 가스를 배출할 수 있는 새로운 장치를 개발했다.","pos":"v.","derived":"development (n.)","wrongWords":["devolve","envelop"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"연구원들은 유용한 가스를 감지할 수 있는 새로운 장치를 개발했다."},{"id":3,"word":"upload","meaning":"업로드하다","example":"Before uploading the report, make sure that no personal information is included.","translation":"보고서를 업로드하기 전에 개인 정보가 포함되지 않았는지 확인해라.","wrongTranslation":"보고서를 업로드한 다음에 개인 정보가 포함되어 있는지 확인해라.","pos":"v.","derived":"upload (n.)","wrongWords":["unload","uphold"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"보고서를 업로드하기 전에 개인 정보가 포함되어 있는지 확인해라."},{"id":4,"word":"method","meaning":"방법","example":"The scientist explained a simple method for reducing plastic waste.","translation":"그 과학자는 플라스틱 쓰레기를 줄이는 간단한 방법을 설명했다.","wrongTranslation":"그 과학자는 플라스틱 쓰레기를 늘리는 간단한 방법을 설명했다.","pos":"n.","derived":"methodical (adj.)","wrongWords":["mettle","mentor"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"그 과학자는 음식물 쓰레기를 줄이는 간단한 방법을 설명했다."},{"id":5,"word":"purchase","meaning":"구매하다, 구매","example":"Customers can purchase tickets online without waiting in a long line.","translation":"고객들은 긴 줄을 기다리지 않고 온라인으로 표를 구매할 수 있다.","wrongTranslation":"고객들은 긴 줄을 기다려야만 온라인으로 표를 구매할 수 있다.","pos":"v./n.","derived":"purchaser (n.)","wrongWords":["purchaser","purpose"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"고객들은 긴 줄을 기다리지 않고 현장에서 표를 구매할 수 있다."},{"id":6,"word":"recommend","meaning":"추천하다","example":"Our teacher recommended a documentary that changed the way I think about technology.","translation":"선생님은 기술에 대한 내 생각을 바꿔 놓은 다큐멘터리를 추천하셨다.","wrongTranslation":"선생님은 기술에 대한 내 생각을 확인해 준 다큐멘터리를 추천하셨다.","pos":"v.","derived":"recommendation (n.)","wrongWords":["recommence","recompense"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"선생님은 기술에 대한 내 생각을 바꿔 놓은 다큐멘터리를 비판하셨다."},{"id":7,"word":"trace","meaning":"흔적, 추적하다","example":"Investigators found traces of the missing vehicle near the river.","translation":"수사관들은 강 근처에서 실종된 차량의 흔적을 발견했다.","wrongTranslation":"수사관들은 강 근처에서 실종된 차량의 소유자를 발견했다.","pos":"n./v.","derived":"traceable (adj.)","wrongWords":["track","trance"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"수사관들은 산 근처에서 실종된 차량의 흔적을 발견했다."},{"id":8,"word":"analyze","meaning":"분석하다","example":"Students analyzed the survey results to understand changes in their classmates’ habits.","translation":"학생들은 반 친구들의 습관 변화를 이해하기 위해 설문 결과를 분석했다.","wrongTranslation":"학생들은 반 친구들의 습관을 바꾸기 위해 설문 결과를 분석했다.","pos":"v.","derived":"analysis (n.)","wrongWords":["analyse","analyst"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"학생들은 반 친구들의 습관 변화를 이해하기 위해 설문 결과를 공개했다."},{"id":9,"word":"predict","meaning":"예측하다","example":"It is difficult to predict how rapidly artificial intelligence will change our jobs.","translation":"인공지능이 우리의 직업을 얼마나 빠르게 바꿀지 예측하기는 어렵다.","wrongTranslation":"인공지능이 우리의 직업을 얼마나 느리게 바꿀지 예측하기는 어렵다.","pos":"v.","derived":"prediction (n.)","wrongWords":["pretext","predate"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"인공지능이 우리의 직업을 얼마나 빠르게 바꿀지 예측하기는 쉽다."},{"id":10,"word":"amount","meaning":"양, 액수","example":"A surprisingly large amount of energy is wasted when devices remain plugged in.","translation":"기기가 계속 꽂혀 있으면 놀랄 만큼 많은 양의 에너지가 낭비된다.","wrongTranslation":"기기가 계속 꽂혀 있으면 놀랄 만큼 적은 양의 에너지가 낭비된다.","pos":"n.","derived":"—","wrongWords":["account","amend"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"기기가 완전히 꺼져 있으면 놀랄 만큼 많은 양의 에너지가 낭비된다."},{"id":11,"word":"communication","meaning":"의사소통, 통신","example":"Clear communication is essential when team members work in different countries.","translation":"팀원들이 서로 다른 나라에서 일할 때 명확한 의사소통은 필수적이다.","wrongTranslation":"팀원들이 같은 나라에서 일할 때 명확한 의사소통은 불필요하다.","pos":"n.","derived":"communicate (v.)","wrongWords":["commutation","communion"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"팀원들이 서로 같은 나라에서 일할 때 명확한 의사소통은 필수적이다."},{"id":12,"word":"flu","meaning":"독감","example":"Several students stayed home because the flu was spreading through the school.","translation":"독감이 학교에 퍼지고 있어서 몇몇 학생들이 집에 머물렀다.","wrongTranslation":"독감이 학교에서 사라지고 있어서 몇몇 학생들이 집에 머물렀다.","pos":"n.","derived":"influenza (n.)","wrongWords":["fly","flue"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"독감이 학교에 퍼지고 있어서 몇몇 학생들이 학교에 모였다."},{"id":13,"word":"influence","meaning":"영향을 미치다, 영향","example":"Social media can influence the decisions people make about what to buy.","translation":"소셜 미디어는 사람들이 무엇을 살지 결정하는 데 영향을 미칠 수 있다.","wrongTranslation":"소셜 미디어는 사람들이 무엇을 살지 결정하는 데 영향을 미치지 않는다.","pos":"v./n.","derived":"influential (adj.)","wrongWords":["influenza","influx"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"소셜 미디어는 사람들이 어디에 살지 결정하는 데 영향을 미칠 수 있다."},{"id":14,"word":"avoid","meaning":"피하다","example":"To avoid losing important files, you should regularly back up your computer.","translation":"중요한 파일을 잃지 않으려면 컴퓨터를 정기적으로 백업해야 한다.","wrongTranslation":"중요한 파일을 잃지 않으려면 컴퓨터를 정기적으로 끄지 않아야 한다.","pos":"v.","derived":"avoidable (adj.)","wrongWords":["avow","await"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"중요한 파일을 잃지 않으려면 컴퓨터를 정기적으로 교체해야 한다."},{"id":15,"word":"spread","meaning":"퍼지다, 퍼뜨리다","example":"False information can spread quickly when people share posts without checking them.","translation":"사람들이 게시물을 확인하지 않고 공유하면 잘못된 정보가 빠르게 퍼질 수 있다.","wrongTranslation":"사람들이 게시물을 확인하고 공유하면 잘못된 정보가 빠르게 퍼질 수 있다.","pos":"v./n.","derived":"spread–spread–spread","wrongWords":["spray","spear"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"사람들이 게시물을 확인하지 않고 공유하면 정확한 정보가 빠르게 퍼질 수 있다."},{"id":16,"word":"symptom","meaning":"증상","example":"A persistent cough can be a symptom of several different illnesses.","translation":"지속적인 기침은 여러 질병의 증상일 수 있다.","wrongTranslation":"지속적인 기침은 여러 질병의 치료법일 수 있다.","pos":"n.","derived":"symptomatic (adj.)","wrongWords":["symbol","system"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"지속적인 기침은 한 가지 질병의 증상일 수 있다."},{"id":17,"word":"database","meaning":"데이터베이스","example":"The hospital stores patient records in a secure database.","translation":"그 병원은 환자 기록을 안전한 데이터베이스에 보관한다.","wrongTranslation":"그 병원은 환자 기록을 누구나 접근할 수 있는 데이터베이스에 보관한다.","pos":"n.","derived":"—","wrongWords":["data bank","datebook"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"그 병원은 의사 명단을 안전한 데이터베이스에 보관한다."},{"id":18,"word":"improve","meaning":"개선하다, 향상시키다","example":"Regular feedback helped the students improve the quality of their presentations.","translation":"정기적인 피드백은 학생들이 발표의 질을 향상시키는 데 도움이 되었다.","wrongTranslation":"정기적인 피드백은 학생들이 발표의 길이를 줄이는 데 도움이 되었다.","pos":"v.","derived":"improvement (n.)","wrongWords":["approve","improvise"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"정기적인 피드백은 학생들이 발표의 속도를 향상시키는 데 도움이 되었다."},{"id":19,"word":"include","meaning":"포함하다","example":"The final price does not include the cost of delivering the equipment.","translation":"최종 가격에는 장비 배송 비용이 포함되지 않는다.","wrongTranslation":"최종 가격에는 장비 배송 비용이 포함되어 있다.","pos":"v.","derived":"inclusion (n.)","wrongWords":["exclude","incline"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"최종 가격에는 장비 설치 비용이 포함되지 않는다."},{"id":20,"word":"performance","meaning":"성과, 공연, 수행 능력","example":"The new software improved the performance of the school’s computers.","translation":"새 소프트웨어는 학교 컴퓨터의 성능을 향상시켰다.","wrongTranslation":"새 소프트웨어는 학교 컴퓨터의 가격을 낮추었다.","pos":"n.","derived":"perform (v.)","wrongWords":["performer","permanence"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"새 소프트웨어는 학교 컴퓨터의 수명을 향상시켰다."},{"id":21,"word":"focus on","meaning":"~에 집중하다","example":"Instead of memorizing every detail, focus on the main idea of the article.","translation":"모든 세부 사항을 외우는 대신 글의 중심 생각에 집중해라.","wrongTranslation":"모든 세부 사항을 외우는 대신 글의 마지막 문장에만 집중해라.","pos":"phr.","derived":"focus (n./v.)","wrongWords":["focus in","focus at"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"모든 세부 사항을 외우는 대신 글의 세부 사례에 집중해라."},{"id":22,"word":"crime","meaning":"범죄","example":"The city installed more streetlights in areas where crime had increased.","translation":"그 도시는 범죄가 증가한 지역에 가로등을 더 설치했다.","wrongTranslation":"그 도시는 범죄가 감소한 지역에 가로등을 더 설치했다.","pos":"n.","derived":"criminal (n./adj.)","wrongWords":["crimp","climb"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"그 도시는 범죄가 증가한 지역에 가로등을 모두 철거했다."},{"id":23,"word":"identify","meaning":"확인하다, 식별하다","example":"The app can identify different kinds of plants from a single photograph.","translation":"그 앱은 사진 한 장으로 여러 종류의 식물을 식별할 수 있다.","wrongTranslation":"그 앱은 사진 한 장으로 여러 종류의 식물을 재배할 수 있다.","pos":"v.","derived":"identification (n.)","wrongWords":["identity","intensify"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"그 앱은 사진 한 장으로 여러 종류의 식물을 번식시킬 수 있다."},{"id":24,"word":"industry","meaning":"산업","example":"The tourism industry has changed significantly because of online booking services.","translation":"온라인 예약 서비스 때문에 관광 산업이 크게 변했다.","wrongTranslation":"온라인 예약 서비스와 관계없이 관광 산업은 거의 변하지 않았다.","pos":"n.","derived":"industrial (adj.)","wrongWords":["industrious","instruct"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"온라인 예약 서비스 때문에 관광 산업이 잠시 중단됐다."},{"id":25,"word":"play a role","meaning":"역할을 하다","example":"Parents and teachers play an important role in helping teenagers make decisions.","translation":"부모와 교사는 청소년이 결정을 내리도록 돕는 데 중요한 역할을 한다.","wrongTranslation":"부모와 교사는 청소년이 결정을 내리지 못하게 하는 데 중요한 역할을 한다.","pos":"phr.","derived":"role (n.)","wrongWords":["play a roll","play a rule"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"부모와 교사는 청소년이 결정을 미루도록 돕는 데 중요한 역할을 한다."},{"id":26,"word":"be likely to","meaning":"~할 가능성이 있다","example":"People who exercise regularly are more likely to sleep well at night.","translation":"규칙적으로 운동하는 사람들은 밤에 잠을 잘 잘 가능성이 더 높다.","wrongTranslation":"규칙적으로 운동하는 사람들은 밤에 잠을 잘 못 잘 가능성이 더 높다.","pos":"phr.","derived":"likely (adj.)","wrongWords":["be liable to","be lucky to"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"가끔씩 운동하는 사람들은 밤에 잠을 잘 잘 가능성이 더 높다."},{"id":27,"word":"draw","meaning":"그리다, 끌어내다","example":"The researchers drew a surprising conclusion from the experiment.","translation":"연구원들은 실험에서 놀라운 결론을 도출했다.","wrongTranslation":"연구원들은 실험에서 놀라운 결론을 부정했다.","pos":"v.","derived":"draw–drew–drawn","wrongWords":["drew","drain"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTranslation2":"연구원들은 실험에서 놀라운 가설을 검증했다."},{"id":28,"word":"meaningful","meaning":"의미 있는","example":"Volunteering became a meaningful experience because we could help our neighbors directly.","translation":"봉사활동은 이웃을 직접 도울 수 있었기 때문에 의미 있는 경험이 되었다.","wrongTranslation":"봉사활동은 이웃을 직접 만날 수 없었기 때문에 의미 있는 경험이 되었다.","pos":"adj.","derived":"meaning (n.)","wrongWords":["meaningless","meanwhile"],"source":"워크시트 어휘 목록","exampleSource":"AI 작성 예문","wrongTra function renderQuiz(){stopTimers();if(state.idx>=35){state.stage='review';state.idx=0;saveProgress();renderReview();return}const w=WORDS[state.quizOrder[state.idx]];state.answered=false;state.translationAnswered=false;const mode=state.step||0;if(mode===0){screen(`<section class="panel"><div class="topline"><span class="pill">STAGE 2 · Spelling Quiz</span><span class="small">${state.idx+1} / 35</span></div>${bar(state.idx+1,35)}<p class="sub">뜻을 보고 알맞은 영어 표현을 고르세요. 틀리면 다시 도전!</p><div class="word" style="font-size:30px">${escapeHtml(w.meaning)}</div><div class="choices" id="choices">${quizChoices(w)}</div><div id="feedback" class="small" style="margin-top:15px"></div></section>`);$('choices').onclick=e=>{const b=e.target.closest('[data-value]');if(!b||state.answered)return;state.attempts++;state.stage2attempts++;if(isAnswer(b.dataset.value,w.word)){state.correct++;state.stage2correct++;state.answered=true;b.classList.add('correct');$('feedback').textContent='정답! 예문 해석 문제로 이동합니다.';sound('correct');saveProgress();moveTimer=setTimeout(()=>{state.step=1;renderQuiz()},1100)}else{b.classList.add('wrong');$('feedback').textContent='다시 선택해 보세요!';sound('wrong');saveProgress();setTimeout(()=>b.classList.remove('wrong'),550)}};autoSpeak(w.word)}else{const {opts:options,correctIndex}=translationOptions(w,state.idx,'quiz');screen(`<section class="panel"><div class="topline"><span class="pill">STAGE 2 · Example Translation</span><span class="small">${state.idx+1} / 35</span></div>${bar(state.idx+1,35)}<p class="sub">영어 문장을 읽고 알맞은 한국어 해석을 선택해야 다음 문제로 넘어갑니다.</p><div class="example"><strong>${escapeHtml(w.example)}</strong><button class="sound" id="say">🔊</button></div><div class="choices" id="translations">${options.map((v,i)=>`<button class="choice" data-choice="${i}">${i+1}. ${escapeHtml(v)}</button>`).join('')}</div><div id="feedback" class="small" style="margin-top:15px"></div></section>`);$('say').onclick=()=>speak(w.example);$('translations').onclick=e=>{let b=e.target.closest('[data-choice]');if(!b||state.translationAnswered)return;state.attempts++;if(+b.dataset.choice===correctIndex){state.correct++;state.translationAnswered=true;b.classList.add('correct');$('feedback').textContent='정답! 다음 문제로 이동합니다.';sound('correct');saveProgress();moveTimer=setTimeout(()=>{state.idx++;state.step=0;saveProgress();renderQuiz()},1100)}else{b.classList.add('wrong');$('feedback').textContent='핵심 의미가 다른 부분을 찾아 다시 골라 보세요.';sound('wrong');saveProgress();setTimeout(()=>b.classList.remove('wrong'),550)}};autoSpeak(w.example)}}
function renderReview(){stopTimers();if(state.idx>=35){state.stage='done';saveProgress();finish();return}const w=WORDS[state.reviewOrder[state.idx]];screen(`<section class="panel"><div class="topline"><span class="pill">STAGE 3 · Review Cards</span><span class="small">${state.idx+1} / 35</span></div>${bar(state.idx+1,35)}<div class="flash" id="flash"><div class="tag">카드를 눌러 뜻 확인</div><div class="big" id="flashText">${escapeHtml(w.word)}</div></div><div class="center" style="margin-top:10px"><button class="sound" id="sayWord">🔊 단어 듣기</button></div><div class="example"><div class="tag">AI 작성 예문</div><strong>${escapeHtml(w.example)}</strong><button class="sound" id="sayEx">🔊</button><div class="translation">${escapeHtml(w.translation)}</div><div class="small">${escapeHtml(w.pos)} · ${escapeHtml(w.derived)} <button class="sound" id="sayDer">🔊</button></div>${googleImageLink(w)}</div><div class="actions"><button class="btn secondary" id="prev" ${state.idx===0?'disabled':''}>← 이전</button><button class="btn" id="next" disabled>뜻 확인 후 다음 →</button></div></section>`);let flipped=false;$('flash').onclick=()=>{flipped=!flipped;$('flashText').textContent=flipped?w.meaning:w.word;if(flipped){$('next').disabled=false;$('next').textContent='다음 카드 →';sound('click')}};$('sayWord').onclick=()=>speak(w.word);$('sayEx').onclick=()=>speak(w.example);$('sayDer').onclick=()=>speak(w.derived.replace(/\([^)]*\)/g,''));$('prev').onclick=()=>{state.idx--;renderReview()};$('next').onclick=()=>{state.reviewed=Math.max(state.reviewed,state.idx+1);state.idx++;saveProgress();renderReview()};autoSpeak(w.word)}
function finish(){stopTimers();const pct=state.attempts?Math.round(state.correct/state.attempts*100):0;const qPct=state.stage2attempts?Math.round(state.stage2correct/state.stage2attempts*100):0;const rec={...state.student,correct:state.correct,attempts:state.attempts,accuracy:pct,quizCorrect:state.stage2correct,quizAttempts:state.stage2attempts,quizAccuracy:qPct,score:state.correct,stage:'완료',completedAt:new Date().toISOString(),reviewed:state.reviewed};const all=JSON.parse(localStorage.getItem(STORE)||'{}');all[rec.cls+'::'+rec.name]=rec;localStorage.setItem(STORE,JSON.stringify(all));publish({...rec,student:state.student});sound('tada');screen(heading('🎉 Mission Complete!','모든 학습을 마쳤어요!')+`<section class="panel center"><div style="font-size:70px">${state.student.avatar}</div><h2>${escapeHtml(state.student.cls)} ${escapeHtml(state.student.name)}</h2><div class="statgrid"><div class="stat">총 정답<br><b>${rec.correct}</b></div><div class="stat">총 시도<br><b>${rec.attempts}</b></div><div class="stat">정답률<br><b>${rec.accuracy}%</b></div></div><p class="sub">어휘 퀴즈: ${rec.quizCorrect}/${rec.quizAttempts}회 정답 · 복습 카드 ${rec.reviewed}장</p><div class="actions"><button class="btn" id="restart">새 학생 / 새 반</button></div></section>`);$('restart').onclick=()=>{state.avatar='🐱';startScreen()}}
function localRecords(){try{return Object.values(JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){return []}}
function teacherScreen(){stopTimers();clearInterval(pollTimer);state.stage='teacher';screen(heading('👨‍🏫 교사 대시보드','학급별 성취도 · 정답률 · 학습 진행 상황')+`<section class="panel"><div class="topline"><h2>실시간 학습 현황</h2><button class="btn secondary" id="back">← 학생 화면</button></div><div class="notice" id="status">연결 상태 확인 중…</div><div class="fields" style="margin-top:18px"><label class="field">학급 선택<select id="classFilter" style="padding:12px;border-radius:12px;border:1px solid #dce0eb"><option value="">전체 학급</option></select></label><label class="field">새로고침<button class="btn secondary" id="refresh">↻ 데이터 불러오기</button></label></div><div class="tablewrap" style="margin-top:20px"><table><thead><tr><th>순위</th><th>반</th><th>아바타</th><th>이름</th><th>총점</th><th>정답률</th><th>단계</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><button class="btn danger" id="clearLocal">이 기기 로컬 기록 삭제</button><button class="btn outline" id="teacherLogin">교사 로그인 / 재연결</button></div><p class="small">다른 기기의 학생 데이터를 보려면 Firebase 연동과 교사 인증이 필요합니다. 로컬 기록은 이 브라우저에서만 확인됩니다.</p></section>`);$('back').onclick=startScreen;$('clearLocal').onclick=()=>{if(confirm('이 기기에 저장된 모든 학생 데이터를 삭제하시겠습니까?')){localStorage.removeItem(STORE);renderTable([]);alert('이 기기 로컬 기록이 삭제되었습니다. 서버 기록은 유지됩니다.')}};$('refresh').onclick=refreshTeacher;$('teacherLogin').onclick=loginTeacher;renderTable(localRecords());refreshTeacher();pollTimer=setInterval(()=>{if(state.stage==='teacher')refreshTeacher(true)},4000)}
function renderTable(data){const classes=[...new Set(data.map(x=>x.cls).filter(Boolean))].sort();const select=$('classFilter');const selected=select.value;select.innerHTML='<option value="">전체 학급</option>'+classes.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');select.value=classes.includes(selected)?selected:'';const paint=()=>{let arr=data.filter(x=>!select.value||x.cls===select.value).sort((a,b)=>(b.score||0)-(a.score||0)||(b.accuracy||0)-(a.accuracy||0));$('rows').innerHTML=arr.map((x,i)=>`<tr class="${i<5?'rank'+(i+1):''}"><td>${i+1}</td><td>${escapeHtml(x.cls)}</td><td>${escapeHtml(x.avatar)}</td><td>${escapeHtml(x.name)}</td><td>${Number(x.score||x.correct||0)}</td><td>${Number(x.accuracy||0)}%</td><td>${escapeHtml(x.stage||'진행 중')}</td></tr>`).join('')||'<tr><td colspan="7" class="center">아직 기록이 없습니다.</td></tr>'};select.onchange=paint;paint()}
const configured=()=>!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL);const dbURL=()=>FIREBASE_CONFIG.databaseURL.replace(/\/$/,'');async function firebaseSignIn(endpoint,body){const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+endpoint+'?key='+encodeURIComponent(FIREBASE_CONFIG.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const x=await r.json();if(!r.ok)throw Error(x.error?.message||'Firebase 로그인 실패');return x}
async function ensureStudentAuth(){if(!configured())return false;if(authToken)return true;try{const x=await firebaseSignIn('signUp',{returnSecureToken:true});authToken=x.idToken;authUID=x.localId;return true}catch(e){console.warn(e);return false}}
async function publish(rec){if(!configured())return;try{if(!await ensureStudentAuth())return;const r=await fetch(dbURL()+'/sessions/'+encodeURIComponent(authUID)+'.json?auth='+encodeURIComponent(authToken),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...rec,updatedAt:new Date().toISOString()})});if(!r.ok)console.warn('동기화 실패',r.status)}catch(e){console.warn('동기화 실패',e)}}
async function loginTeacher(){if(!configured()){alert('Firebase 연결 정보가 없습니다. README를 참고해 설정하세요.');return}const email=prompt('Firebase에 등록한 교사 이메일');if(!email)return;const password=prompt('교사 계정 비밀번호');if(!password)return;try{const x=await firebaseSignIn('signInWithPassword',{email,password,returnSecureToken:true});if(FIREBASE_CONFIG.teacherUID&&x.localId!==FIREBASE_CONFIG.teacherUID)throw Error('등록된 교사 UID가 아닙니다.');teacherToken=x.idToken;await refreshTeacher();alert('교사 계정으로 연결되었습니다.')}catch(e){alert('로그인 실패: '+e.message)}}
async function refreshTeacher(silent=false){if(state.stage!=='teacher')return;if(!configured()){$('status').textContent='⚠️ Firebase 미설정: 이 기기의 로컬 기록만 표시 중입니다. 실시간 학급 집계는 아직 연결되지 않았습니다.';renderTable(localRecords());return}if(!teacherToken){$('status').textContent='🔐 교사 로그인 필요: 상단의 「교사 로그인 / 재연결」을 눌러 주세요.';renderTable(localRecords());return}try{const r=await fetch(dbURL()+'/sessions.json?auth='+encodeURIComponent(teacherToken),{cache:'no-store'});if(!r.ok)throw Error('서버 조회 실패 '+r.status);const data=await r.json();const records=Object.values(data||{}).filter(x=>x&&x.student).map(x=>({...x.student,score:x.correct||0,correct:x.correct||0,attempts:x.attempts||0,accuracy:x.attempts?Math.round(100*x.correct/x.attempts):0,stage:x.stage==='done'?'완료':x.stage||'진행 중'}));$('status').textContent='🟢 서버 연결됨 · 약 4초마다 갱신 · '+new Date().toLocaleTimeString('ko-KR');renderTable(records)}catch(e){$('status').textContent='🔴 서버 연결 실패: '+e.message+' · Firebase 설정 및 규칙을 확인하세요.';if(!silent)console.error(e)}}
$('teacherBtn').onclick=teacherScreen;window.addEventListener('beforeunload',stopTimers);startScreen();
</script></body></html>
